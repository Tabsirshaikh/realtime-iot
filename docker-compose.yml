version: "3.8"

networks:
  iot-network:
    driver: bridge

volumes:
  redpanda-data:
  postgres-data:
  grafana-data:

services:
  # ==========================================
  # Redpanda Message Broker (sensors.raw & sensors.alerts)
  # ==========================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.8
    container_name: iot-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
    ports:
      - "19092:19092"
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda Web Console
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: iot-redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - iot-network

  # Auto-create contract topics on startup
  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.8
    container_name: iot-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - iot-network
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo 'Creating contract topics on Redpanda...'
      rpk topic create sensors.raw -p 3 -r 1 --brokers redpanda:9092 || true
      rpk topic create sensors.alerts -p 1 -r 1 --brokers redpanda:9092 || true
      echo 'Contract topics ready:'
      rpk topic list --brokers redpanda:9092
      "

  # ==========================================
  # PostgreSQL Hot Store
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: iot_db
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Grafana Dashboard (Auto-provisioned)
  # ==========================================
  grafana:
    image: grafana/grafana:10.3.3
    container_name: iot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iot-network
