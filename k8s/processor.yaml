apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processor
  namespace: iot-pipeline
  labels:
    app: stream-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-processor
  template:
    metadata:
      labels:
        app: stream-processor
    spec:
      containers:
        - name: processor
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir confluent-kafka psycopg2-binary
              python processor.py --bootstrap-servers redpanda:9092 --postgres-host postgres --postgres-port 5432
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
