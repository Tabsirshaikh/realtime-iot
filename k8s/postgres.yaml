apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-schema
  namespace: iot-pipeline
data:
  01_schema.sql: |
    CREATE TABLE IF NOT EXISTS readings (
        device_id TEXT NOT NULL,
        room TEXT NOT NULL,
        event_ts TIMESTAMPTZ NOT NULL,
        temperature_c DOUBLE PRECISION NOT NULL,
        power_kw DOUBLE PRECISION NOT NULL
    );

    CREATE TABLE IF NOT EXISTS agg_1m (
        device_id TEXT NOT NULL,
        window_start TIMESTAMPTZ NOT NULL,
        avg_temp DOUBLE PRECISION NOT NULL,
        max_temp DOUBLE PRECISION NOT NULL,
        avg_power DOUBLE PRECISION NOT NULL,
        n INTEGER NOT NULL
    );

    CREATE TABLE IF NOT EXISTS alerts (
        id SERIAL PRIMARY KEY,
        device_id TEXT NOT NULL,
        event_ts TIMESTAMPTZ NOT NULL,
        type TEXT NOT NULL,
        value DOUBLE PRECISION NOT NULL
    );

    CREATE TABLE IF NOT EXISTS rejected (
        id SERIAL PRIMARY KEY,
        raw_payload TEXT NOT NULL,
        reason TEXT NOT NULL,
        ts TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_readings_ts ON readings (event_ts DESC);
    CREATE INDEX IF NOT EXISTS idx_readings_dev_ts ON readings (device_id, event_ts DESC);
    CREATE INDEX IF NOT EXISTS idx_agg_1m_start ON agg_1m (window_start DESC);
    CREATE INDEX IF NOT EXISTS idx_alerts_ts ON alerts (event_ts DESC);
    CREATE INDEX IF NOT EXISTS idx_rejected_ts ON rejected (ts DESC);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: iot-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: iot-pipeline
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "iot_db"
            - name: POSTGRES_USER
              value: "iot_user"
            - name: POSTGRES_PASSWORD
              value: "iot_password"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-schema
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "iot_user", "-d", "iot_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-schema
          configMap:
            name: postgres-init-schema
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: iot-pipeline
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
