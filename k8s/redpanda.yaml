apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: iot-pipeline
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v23.3.8
          command:
            - redpanda
            - start
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda.iot-pipeline.svc.cluster.local:9092
            - --pandaproxy-addr=internal://0.0.0.0:8082
            - --advertise-pandaproxy-addr=internal://redpanda.iot-pipeline.svc.cluster.local:8082
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --overprovisioned
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 8082
              name: pandaproxy
            - containerPort: 9644
              name: admin
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["rpk", "cluster", "health"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: iot-pipeline
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
    - port: 8082
      targetPort: 8082
      name: pandaproxy
    - port: 9644
      targetPort: 9644
      name: admin
  selector:
    app: redpanda
---
apiVersion: batch/v1
kind: Job
metadata:
  name: topic-init-job
  namespace: iot-pipeline
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: docker.redpanda.com/redpandadata/redpanda:v23.3.8
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Redpanda to become healthy..."
              until rpk cluster health --brokers redpanda:9092; do
                sleep 2
              done
              echo "Creating streaming topics..."
              rpk topic create sensors.raw -p 3 -r 1 --brokers redpanda:9092 || true
              rpk topic create sensors.alerts -p 1 -r 1 --brokers redpanda:9092 || true
              echo "Topics created successfully:"
              rpk topic list --brokers redpanda:9092
